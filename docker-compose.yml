services:
  postgres:
    image: postgres:16
    container_name: minewatch-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: minewatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: minewatch-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
      - ./infra/docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 10s
      timeout: 5s
      retries: 3

  localstack:
    image: localstack/localstack:3.8.1
    container_name: minewatch-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,sns
    volumes:
      - localstack_data:/var/lib/localstack

  api:
    build:
      context: .
      dockerfile: src/MineWatch.Api/Dockerfile
    container_name: minewatch-api
    ports:
      - "5211:5211"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=minewatch;Username=postgres;Password=postgres
      - Jwt__Key=dev-only-demo-key-do-not-use-in-production
      - Jwt__Issuer=MineWatch
      - Jwt__Audience=MineWatchAPI
      - AWS__ServiceURL=http://localstack:4566
      - AWS__Region=ap-southeast-2
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=ap-southeast-2
      - Notification__QueueUrl=
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/MineWatch.Worker/Dockerfile
    container_name: minewatch-worker
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=minewatch;Username=postgres;Password=postgres
      - AWS__ServiceURL=http://localstack:4566
      - AWS__Region=ap-southeast-2
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=ap-southeast-2
      - Sqs__QueueName=minewatch-telemetry
      - Sqs__DLQName=minewatch-telemetry-dlq
      - Sqs__MaxReceiveCount=3
      - Sqs__VisibilityTimeoutSeconds=30
      - Mqtt__Server=mosquitto
      - Mqtt__Port=1883
      - NotificationPublisher__QueueUrl=
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started

  truckmocker:
    build:
      context: .
      dockerfile: TruckMocker/Dockerfile
    container_name: minewatch-truckmocker
    environment:
      - Mqtt__Server=mosquitto
      - Mqtt__Port=1883
      - Simulation__IntervalMs=2000
      - Simulation__VehicleCount=3
    depends_on:
      - worker

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_logs:
  localstack_data:
