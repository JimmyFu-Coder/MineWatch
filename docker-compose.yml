services:
  postgres:
    image: postgres:16
    container_name: minewatch-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: minewatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: minewatch-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mosquitto 2>/dev/null || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3
      
  localstack:
    image: localstack/localstack:3.8.1
    container_name: minewatch-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,sns
    volumes:
      - localstack_data:/var/lib/localstack
      

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_logs:
  localstack_data: 